# Author: Andrey Sarafanov @ Miratech inc
inboundShortMessage:
  name: '{{flow_name}}'
  division: '{{division_name}}'
  startUpRef: /inboundShortMessage/states/state[Initial State_10]
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
  states:
  - state:
      name: Initial State
      refId: Initial State_10
      actions:
      - callBotFlow:
          name: Call Bot Flow
          inputText:
            noValue: true
          exitReason:
            noValue: true
          intent:
            noValue: true
          botFlow:
            '{{bot_flow_name}}':
              ver_latestPublished:
                inputs:
                  Slot.OrderNumberType:
                    noValue: true
                outputs:
                  Slot.OrderNumberType:
                    noValue: true
      - disconnect:
          name: Disconnect
